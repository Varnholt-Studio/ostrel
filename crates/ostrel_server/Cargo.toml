[package]
name = "ostrel_server"
description = "API server of the Ostrel programming language: embeds the VM, resolves the principal and keeps the audit log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Development identity of AC-12 (D127). Off by default; building it without
# debug assertions is a compile error, so a release build can never carry it.
dev-identity = []

[dependencies]
ostrel_core.workspace = true
ostrel_db.workspace = true
# Message types, limits and wire codec of the sync protocol (ARCHITECTURE 5.4, 5.9).
ostrel_sync = { path = "../ostrel_sync" }
ostrel_vm.workspace = true
# Allowlisted by D118, only for this crate: SHA-256 of audit arguments (D117)
# and of replica secrets (D111).
sha2 = { version = "0.10", default-features = false, features = ["std"] }
# ARCHITECTURE 4.1 and 11: the socket runs on tokio `current_thread` with one `LocalSet`.
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
# ARCHITECTURE 11: WebSocket framing and the upgrade handshake. Only the re-exported
# `tungstenite` protocol state is used, driven by tokio I/O in `ws/socket.rs`.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
ostrel_db_memory = { path = "../ostrel_db_memory" }
ostrel_db_sqlite = { path = "../ostrel_db_sqlite" }
ostrel_ir.workspace = true
ostrel_sema.workspace = true
ostrel_syntax.workspace = true

[lints]
workspace = true
