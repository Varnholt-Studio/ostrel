[package]
name = "ostrel_auth"
description = "PASETO v4.public tokens and identity primitives of the Ostrel programming language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Both crates are on the dependency allowlist (ARCHITECTURE 11).
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }

