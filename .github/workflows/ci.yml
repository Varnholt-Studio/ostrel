name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Superseded runs are cancelled only for pull requests from team branches.
# Runs on main and dev, and pull requests whose head is a reserved branch,
# always finish so every integrated commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !contains(fromJSON('["main","dev","gh-pages","packaging"]'), github.head_ref) }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install && rustc --version && cargo --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Quality gate
        run: bash ci/gate.sh
